name: friday-report
on:
  schedule:
    - cron: "0 7 * * 5"  # 07:00 UTC Fridays
  workflow_dispatch:
    inputs:
      live:
        description: "Use live DashScope provider (true) or fake (false)"
        type: boolean
        default: true
      top_n:
        description: "Limit top results for smoke runs"
        type: number
        default: 5
concurrency:
  group: friday-report
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run Friday pipeline
        id: pipeline
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          FRONTIER_LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          FRONTIER_LLM_MODEL: qwen-plus
          GITHUB_TOKEN: ${{ secrets.FRONTIER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          FRONTIER_LLM_PROVIDER: ${{ github.event.inputs.live == 'false' && 'fake' || 'dashscope' }}
          TOP_N: ${{ github.event.inputs.top_n || 25 }}
        run: frontier-pipeline run --graph graphs/friday_report.yaml
      - name: Commit wiki and reports
        run: |
          git config user.name "frontier-bot"
          git config user.email "frontier-bot@users.noreply.github.com"
          git add wiki reports
          if git diff --staged --quiet; then
            echo "No report/wiki changes to commit"
          else
            git commit -m "chore(reports): Friday frontier report"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
      - name: Fail if pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
