name: daily-ingest
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:
concurrency:
  group: daily-ingest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run daily ingest
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          FRONTIER_LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          FRONTIER_LLM_MODEL: qwen-plus
          # Prefer a PAT with higher Search API limits if set; else Actions token.
          GITHUB_TOKEN: ${{ secrets.FRONTIER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          FRONTIER_LLM_PROVIDER: dashscope
          TOP_N: "25"
        run: frontier-pipeline run --graph graphs/daily_ingest.yaml
      - name: Commit wiki
        run: |
          git config user.name "frontier-bot"
          git config user.email "frontier-bot@users.noreply.github.com"
          git add wiki
          if git diff --staged --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "chore(wiki): daily AI-agent curation"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
